name: Build NexusPlay Debug APK

# Workflow CI pertama untuk fork Lemuroid (eksperimen Milestone 1).
# Berbeda dengan publish.yml bawaan upstream (yang hanya jalan saat
# push tag DAN butuh secret keystore rilis), workflow ini membangun
# APK debug di setiap push ke master — tanpa secret apa pun.
# Varian free+bundle: core dibundel dari submodule lemuroid-cores,
# jadi APK bisa langsung main tanpa unduh core. Debug APK memakai
# debug.keystore yang sudah di-commit upstream (tanda tangan stabil).
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Free Bundle Debug APK
        run: ./gradlew assembleFreeBundleDebug

      - name: List APK outputs
        run: find lemuroid-app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusPlay-app-debug
          path: lemuroid-app/build/outputs/apk/freeBundle/debug/*.apk
